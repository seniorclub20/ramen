<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device=width">
    <title>ラーメン太一</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header> <!== ファーストビューの一番上(非常に重要) ==>
      <div class="container">      
        <h1>ラーメン太一</h1>
        <nav>
          <ul>
            <li><a href="#">ホーム</a></li>
	    <li><a href="#">店舗紹介</a></li>
            <li><a href="#">メニュー</a></li>
            <li><a href="#">アクセス</a></li>
            <li><a href="contact.html">お問い合わせ</a></li>
            <li><a href="#">お知らせ</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
        <h2>お問い合わせ</h2>
        <p>お気軽にお問い合わせください</p>
        <form action="index.html" method="post">
          <div>
            <label for="name">お名前</label> <!== インライン要素 ==>
            <input type="text" name="name" id="name"> <!== id="name"(お名前を選択しても入力できる) ==> <!== インライン要素(お名前を箱が並ぶ) ==>
          </div>
          <div>
            <label for="email">メール</label>
            <input type="text" name="email" id="email"> <!== inputは1行 ==>
          </div>
          <div>
            <label for="naiyou">内容</label>
            <textarea name="naiyou" rows="8" cols="80" id="naiyou"></textarea> <!== 8行×80文字(1行) ==>
          </div>
          <div>
            <input type="submit" value="送信する">
          </div>
        </form>
      </section>
    </main>
    <aside> <!== 補足情報 ==>
      <h2>お知らせ</h2>
      <p>「北関東ラーメンフェスタ2025」出店店舗決定</p>
      <figure>
        <img src="images/icon.png" alt="ラーメンアイコン">
      </figure>
      <a href="#" class="button">詳細はこちらから</a> <!== リンクを直接ボタン ==>
    </aside>
    <footer>
